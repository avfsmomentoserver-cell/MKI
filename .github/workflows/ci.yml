# MKC CI — runs on GitHub-hosted runners (they cannot reach the dev host's
# Postgres, so the job uses a self-contained pgvector/pgvector:pg17 service
# container). Note: this file is authored on the dev box; it is exercised on
# the GitHub remote only (see ops/DEPLOYMENT.md, "CI").
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: mkc
          POSTGRES_PASSWORD: mkc
          POSTGRES_DB: mkc_test
        ports:
          - 5432:5432
        # Give the container a head start; the explicit pg_isready loop below
        # remains the authoritative readiness gate.
        options: >-
          --health-cmd "pg_isready -U mkc -d mkc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Test schema for the backend (psycopg3 driver URL shape); conftest
      # asserts the DB name contains "mkc_test" as a safety guard.
      DATABASE_URL: postgresql+psycopg://mkc:mkc@localhost:5432/mkc_test
      MKC_TEST_DB_URL: postgresql+psycopg://mkc:mkc@localhost:5432/mkc_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # The [dev] extra already declares pytest and ruff; httpx is a core
      # dependency — one editable install covers everything CI needs.
      - name: Install backend (editable, with dev extra)
        run: python -m pip install -e "backend[dev]"

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U mkc -d mkc_test; then
              echo "postgres is ready (attempt $i)"
              exit 0
            fi
            echo "waiting for postgres (attempt $i)..."
            sleep 2
          done
          echo "postgres did not become ready in time" >&2
          exit 1

      # Migration check on a clean DB proves the alembic chain applies from
      # scratch. The initial migration (3efd7b1a065c) uses only built-in
      # types, so no extension setup is required on the CI database. If a
      # future migration needs an extension, add it here, e.g.:
      #   psql -h 127.0.0.1 -U mkc -d mkc_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Run alembic migrations against a clean test database
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic current

      - name: Lint (ruff)
        working-directory: backend
        run: python -m ruff check src tests

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q
